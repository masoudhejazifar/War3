name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p build
          unzip -q -o "$ZIP" -d build
          ls build

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: build/risk-app
        run: npm install

      - name: Create Android project
        working-directory: build/risk-app
        run: npx cap add android

      - name: Add native code
        working-directory: build/risk-app
        run: python3 native/apply.py

      - name: Copy web files
        working-directory: build/risk-app
        run: npx cap sync android

      - name: Build APK
        working-directory: build/risk-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RiskWatch-APK
          path: build/risk-app/android/app/build/outputs/apk/debug/app-debug.apk
